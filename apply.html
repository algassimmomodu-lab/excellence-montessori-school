<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissions | Excellence Montessori</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f6fc;margin:0;padding:18px;color:#17304f}
main{max-width:650px;margin:auto;background:white;padding:22px;border-radius:14px;box-shadow:0 3px 15px #0002}
h1{color:#0757a8;font-size:25px}
p{line-height:1.5}
label{display:block;font-weight:bold;margin-top:14px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccd6e0;border-radius:7px;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;background:#0757a8;color:white;border:0;border-radius:8px;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#notice{margin-top:15px;padding:12px;border-radius:7px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>EXCELLENCE Montessori Preparatory and Modern High School</h1>
<p><b>Admissions for 2026/2027</b><br>Lower Allentown, Freetown, Sierra Leone<br>Nursery 1 to JSS 3</p>

<form id="admissionForm">
<label>Student's Full Name<input id="student" required></label>
<label>Date of Birth<input id="dob" type="date" required></label>
<label>Gender
<select id="gender" required>
<option value="">Select gender</option><option>Male</option><option>Female</option>
</select></label>
<label>Class Applying For
<select id="classApply" required>
<option value="">Select class</option>
<option>Nursery 1</option><option>Nursery 2</option><option>Nursery 3</option>
<option>Primary 1</option><option>Primary 2</option><option>Primary 3</option>
<option>Primary 4</option><option>Primary 5</option><option>Primary 6</option>
<option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
</select></label>
<label>Parent/Guardian Full Name<input id="guardian" required></label>
<label>Parent/Guardian Phone<input id="phone" type="tel" required></label>
<label>Previous School<input id="previous"></label>
<label>Home Address<textarea id="address" rows="2" required></textarea></label>
<label>Additional Information<textarea id="additional" rows="3"></textarea></label>

<label>Choose WhatsApp number to receive this application
<select id="whatsappNumber" required>
<option value="">Select a school WhatsApp number</option>
<option value="23234802516">+232 34802516</option>
<option value="23234134890">+232 34134890</option>
<option value="23275974122">+232 75974122</option>
<option value="23277218011">+232 77218011</option>
</select>
</label>

<button id="submitBtn" type="submit">Submit Application</button>
</form>

<div id="notice" role="status" aria-live="polite"></div>
<p>Need help? Contact the school on WhatsApp: +232 34802516, +232 34134890, +232 75974122 or +232 77218011.</p>
</main>

<script>
const db = window.supabase.createClient(
  "https://dzngixqdompgueenlima.supabase.co",
  "sb_publishable_Y_7FiYB5p_ue1Yggk92pIA_qHN7Ik96"
);

const form = document.getElementById("admissionForm");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("submitBtn");
  const notice = document.getElementById("notice");
  const selectedWhatsAppNumber = document.getElementById("whatsappNumber").value;

  if (!selectedWhatsAppNumber) {
    notice.textContent = "Please choose a school WhatsApp number.";
    return;
  }

  button.disabled = true;
  notice.textContent = "Saving your application...";

  const application = {
    student_name: document.getElementById("student").value.trim(),
    dob: document.getElementById("dob").value,
    gender: document.getElementById("gender").value,
    class_apply: document.getElementById("classApply").value,
    guardian_name: document.getElementById("guardian").value.trim(),
    guardian_phone: document.getElementById("phone").value.trim(),
    previous_school: document.getElementById("previous").value.trim(),
    address: document.getElementById("address").value.trim(),
    additional_information: document.getElementById("additional").value.trim(),
    status: "new"
  };

  try {
    const { error } = await db.from("admission").insert([application]);
    if (error) throw error;

    notice.textContent = "Application saved successfully. Opening WhatsApp...";

    const message = [
      "NEW SCHOOL ADMISSION APPLICATION",
      "EXCELLENCE Montessori Preparatory and Modern High School",
      "",
      "Student: " + application.student_name,
      "Date of birth: " + application.dob,
      "Gender: " + application.gender,
      "Class applying for: " + application.class_apply,
      "Parent/Guardian: " + application.guardian_name,
      "Guardian phone: " + application.guardian_phone,
      "Previous school: " + (application.previous_school || "Not provided"),
      "Address: " + application.address,
      "Additional information: " + (application.additional_information || "None"),
      "",
      "This application has also been saved in the school's online records."
    ].join("\n");

    const whatsappUrl = "https://wa.me/" + selectedWhatsAppNumber +
      "?text=" + encodeURIComponent(message);

    window.location.href = whatsappUrl;
  } catch (error) {
    notice.textContent = "Application not submitted. " +
      (error.message || "Please check your internet connection and try again.");
    button.disabled = false;
  }
});
</script>
</body>
</html>
